<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <h2 style="color: #333;">Verify your email</h2>
  <p>Hello {{name}},</p>
  <p>Thank you for signing up. Please verify your email address by clicking the button below:</p>
  <p style="margin: 30px 0;">
    <a href="{{verify_url}}" style="background: #28a745; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">Verify Email</a>
  </p>
  <p>Or copy this link to your browser:</p>
  <p style="word-break: break-all; color: #666;">{{verify_url}}</p>
  <p style="margin-top: 30px; color: #666; font-size: 14px;">
    If you didn't create an account, you can safely ignore this email.
  </p>
  <hr style="border: none; border-top: 1px solid #eee; margin: 30px 0;">
  <p style="color: #999; font-size: 12px;">© LMS - Learning Management System</p>
</body>
</html>
